name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: 'write'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - macos-15
          - ubuntu-22.04
          - windows-2025

    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup GO
        run: |
          go version
          echo GOPATH=$(go env GOPATH) >> $GITHUB_ENV
          echo GOBIN=$(go env GOPATH)/bin >> $GITHUB_ENV
          echo $(go env GOPATH)/bin >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Install LibSecret
        if: matrix.os == 'ubuntu-latest' # only for ubuntu 24 or latest
        run:
          sudo apt-get install libsecret-1-dev

      - name: Setup .NET 9
        if: ${{ startsWith(matrix.os, 'windows-') }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Install AzureSignTool
        if: ${{ startsWith(matrix.os, 'windows-') }}
        run: dotnet tool install --global AzureSignTool --version 7.0.1

      - name: Check out Git repository
        uses: actions/checkout@v7

      # Must run after checkout: with these credentials in the URL, checkout's fetch hangs in the macOS keychain credential helper.
      - name: Setup
        run: |
          git config --global url."https://${{secrets.USER}}:${{secrets.TOKEN}}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${{secrets.USER}}:${{secrets.TOKEN}}@api.github.com/".insteadOf "https://api.github.com/"

      - name: Fail if middleware.version contains nightly
        shell: bash
        run: |
          set -euo pipefail

          pkg="package.json"
          mw="middleware.version"

          if [[ ! -f "$pkg" ]]; then
            echo "package.json not found"
            exit 1
          fi

          if [[ ! -f "$mw" ]]; then
            echo "middleware.version not found"
            exit 1
          fi

          pkg_version="$(grep -E '"version"\s*:' "$pkg" | head -n1 | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/')"

          if [[ -z "$pkg_version" ]]; then
            echo "failed to extract version from package.json"
            exit 1
          fi

          echo "package.json version: $pkg_version"

          if [[ "$pkg_version" =~ alpha ]]; then
            echo "alpha version detected, nightly check skipped"
            exit 0
          fi

          if grep -Eq '.*-nightly.*' "$mw"; then
            echo "::error file=$mw::nightly version is not allowed for non-alpha package"
            cat "$mw"
            exit 1
          fi

      - name: Verify git tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"

          pkg_version="$(jq -r '.version' package.json)"

          echo "git tag version: $tag_version"
          echo "package.json version: $pkg_version"

          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "::error::Git tag version ($tag_version) does not match package.json version ($pkg_version)"
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25.2.1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Update locale
        run: bun run update:locale
        env:
          GITHUB_TOKEN: ${{secrets.TOKEN}}

      #- name: Update Deps
      #  run: bun run build:deps

      - name: Update Addon only AMD
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: bash
        run: |
          ./update-ci.sh --user="${{secrets.USER}}" --token="${{secrets.TOKEN}}" --os="${{matrix.os}}" --middleware-version="$( cat middleware.version )"

      - name: Update Addon AMD and ARM
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        shell: bash
        run: |
          ./update-ci.sh --user="${{secrets.USER}}" --token="${{secrets.TOKEN}}" --os="${{matrix.os}}" --middleware-version="$( cat middleware.version )" --arch="arm"
          ./update-ci.sh --user="${{secrets.USER}}" --token="${{secrets.TOKEN}}" --os="${{matrix.os}}" --middleware-version="$( cat middleware.version )" --arch="amd"

      - name: Install Protoc
        shell: bash
        env:
          PROTOC_VERSION: "23.4"
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)   ZIP="protoc-${PROTOC_VERSION}-linux-x86_64.zip" ;;
            macOS)   ZIP="protoc-${PROTOC_VERSION}-osx-universal_binary.zip" ;;
            Windows) ZIP="protoc-${PROTOC_VERSION}-win64.zip" ;;
            *)       echo "Unsupported OS: ${{ runner.os }}"; exit 1 ;;
          esac
          DEST="$HOME/protoc"
          mkdir -p "$DEST"
          curl -fsSL -o "$DEST/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${ZIP}"
          unzip -o "$DEST/protoc.zip" -d "$DEST"
          rm "$DEST/protoc.zip"
          echo "$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/protoc" --version

      - name: Generate protobuf TypeScript bindings
        run: bash scripts/generate-protos.sh --from-dist

      - name: Build Native Messaging Host Windows
        if: ${{ startsWith(matrix.os, 'windows-') }}
        run: bun run build:nmh-win
        env:
          CGO_ENABLED: 0

      - name: Build Native Messaging Host
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        run: bun run build:nmh
        env:
          CGO_ENABLED: 0

      # Before the frontend build: scripts/prepare-forwarder.js signs anytype-mcp (the Connect-to-AI forwarder) with the
      # same Developer ID identity the app gets, and scripts/build-mcp.js packs those signed bytes into Anytype.mcpb
      - name: Import macOS certificates
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: |
          echo "$MAC_CERT_TEXT" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MAC_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
        env:
          MAC_CERT_TEXT: ${{ secrets.MAC_CERT_TEXT }}
          MAC_CERT_PASS: ${{ secrets.MAC_CERT_PASS }}

      # Windows: the forwarder (dist/anytype-mcp.exe) is signed in a step of its own: scripts/prepare-forwarder.js checks it
      # (namespace, revision, `version --json` run with none of this step's secrets), signs it with the existing hook
      # electron/hook/sign.js (AzureSignTool, the secrets of the packaging step) and checks the signature (valid,
      # timestamped, our publisher). "Build frontend" runs prepare-forwarder.js again without the secrets and keeps that exe
      - name: Sign the forwarder Windows
        if: ${{ startsWith(matrix.os, 'windows-') }}
        run: node scripts/prepare-forwarder.js
        env:
          FORWARDER_SIGN_REQUIRED: '1'
          WIN_PUBLISHER_SUBJECT: ${{ vars.WIN_PUBLISHER_SUBJECT }}
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # No Azure secret here: Vite, its plugins and the downloaded forwarder's probe run in this step
      - name: Build frontend
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Tag builds on macOS and Windows: the Claude Desktop bundle (dist/mcp/Anytype.mcpb) is built unsigned and kept for
          # "Sign the Claude Desktop bundle" below. Linux builds no bundle
          MCPB_SIGN_DEFERRED: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(matrix.os, 'ubuntu-') && '1' || '' }}
          # The release flavour of the forwarder: it must be signed (Windows: by "Sign the forwarder Windows"), or the build fails
          FORWARDER_SIGN_REQUIRED: '1'
          # The exact subject of the Windows code-signing certificate (repository variable; public, so not a secret): the
          # signed forwarder and the bundle's signer must have it, or the build fails
          WIN_PUBLISHER_SUBJECT: ${{ vars.WIN_PUBLISHER_SUBJECT }}

      # Tag builds on macOS and Windows: the bundle "Build frontend" left unsigned is signed with the Windows code-signing
      # certificate in Azure Key Vault, remotely (scripts/sign-mcpb-azure.js: the key never leaves the vault), verified
      # (signature, chain, signer), and the build's metadata (electron/json/aiConnect.build.json) rewritten for the signed
      # bytes. Before packaging, only this step and "Sign the forwarder Windows" hold the Azure secrets
      - name: Sign the Claude Desktop bundle
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(matrix.os, 'ubuntu-') }}
        run: node scripts/build-mcp.js --sign
        env:
          WIN_PUBLISHER_SUBJECT: ${{ vars.WIN_PUBLISHER_SUBJECT }}
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # S12 / T4: the real forwarder's own store-folder rule (heart N9) in folders the desktop creates — a scratch profile
      # that Users may read, `.anytype` and `bin` made by Anytype's code, then `key set` / `key check`. BEFORE packaging:
      # electron-builder publishes as it packages, so a forwarder that can't use its store must fail the job first. The exe
      # is the one "Sign the forwarder Windows" signed; afterSign then proves the package holds exactly these bytes.
      - name: Check the forwarder's store folders Windows
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: pwsh
        env:
          ANYTYPE_MCP_BIN: dist/anytype-mcp.exe
        run: |
          if (-not (Test-Path -LiteralPath $env:ANYTYPE_MCP_BIN)) {
            Write-Output "::error::$env:ANYTYPE_MCP_BIN is missing"
            exit 1
          }
          bunx vitest run electron/ts/lib/aiConnect/forwarder.windows.integration.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and publish Mac OS
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: bunx electron-builder --macos --arm64 --x64 ${{ startsWith(github.ref, 'refs/tags/v') && '--publish always' || '' }}
        env:
          DEBUG: electron-builder
          FORWARDER_SIGN_REQUIRED: '1'
          MCPB_SIGN_REQUIRED: '1'
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLETEAM: ${{ secrets.APPLETEAM }}
          USE_HARD_LINKS: false
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Package and publish Other
        if: ${{ !startsWith(matrix.os, 'macos-') }}
        run: bunx electron-builder ${{ startsWith(matrix.os, 'windows-') && '--windows' || '--linux' }} ${{ startsWith(github.ref, 'refs/tags/v') && '--publish always' || '' }}
        env:
          DEBUG: electron-builder
          FORWARDER_SIGN_REQUIRED: '1'
          MCPB_SIGN_REQUIRED: ${{ !startsWith(matrix.os, 'ubuntu-') && '1' || '' }}
          USE_HARD_LINKS: false
          AZURE_KEY_VAULT_URI: ${{ startsWith(matrix.os, 'windows-') && secrets.AZURE_KEY_VAULT_URI || '' }}
          AZURE_CLIENT_ID: ${{ startsWith(matrix.os, 'windows-') && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ startsWith(matrix.os, 'windows-') && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_CERT_NAME: ${{ startsWith(matrix.os, 'windows-') && secrets.AZURE_CERT_NAME || '' }}
          AZURE_TENANT_ID: ${{ startsWith(matrix.os, 'windows-') && secrets.AZURE_TENANT_ID || '' }}
          WIN_PUBLISHER_SUBJECT: ${{ vars.WIN_PUBLISHER_SUBJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # The finished packages: the nested forwarder is still the binary that was signed before the build
      # (electron/hook/verify-forwarder.js). These automate the plan's spikes S2 and S4 and fail the build on a mismatch:
      # macOS — `mac.signIgnore` kept the signature (codesign --verify --strict, identifier com.anytype.mcp, hardened
      # runtime, no entitlements, both architectures); Windows — the sign hook's early return left the exe alone (Authenticode Valid,
      # timestamped, our publisher);
      # everywhere — its sha256 equals the build's metadata and the copy inside Anytype.mcpb.
      - name: Verify the packaged forwarder Mac OS
        if: ${{ startsWith(matrix.os, 'macos-') }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for app in dist/mac*/*.app; do
            # The package's own architecture: its smoke starts that slice (the Intel one through Rosetta)
            case "$app" in
              dist/mac-arm64/*) arch=arm64 ;;
              dist/mac/*) arch=x64 ;;
              *) echo "::error::no architecture for $app"; exit 1 ;;
            esac
            fwd="$app/Contents/Resources/app.asar.unpacked/dist/anytype-mcp"
            codesign --verify --strict --verbose=2 "$fwd"
            node electron/hook/verify-forwarder.js "$app" --require-signed --require-bundle --arch "$arch"
            count=$((count + 1))
          done
          if [ "$count" -ne 2 ]; then
            echo "::error::expected two packaged apps (arm64 and x64), found $count"
            exit 1
          fi

      - name: Verify the packaged forwarder Windows
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: pwsh
        env:
          WIN_PUBLISHER_SUBJECT: ${{ vars.WIN_PUBLISHER_SUBJECT }}
        run: |
          $fwd = "dist/win-unpacked/resources/app.asar.unpacked/dist/anytype-mcp.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath $fwd
          if ($sig.Status -ne 'Valid') {
            Write-Output "::error::$fwd Authenticode status is $($sig.Status)"
            exit 1
          }
          node electron/hook/verify-forwarder.js dist/win-unpacked --require-signed --require-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the packaged forwarder Linux
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        shell: bash
        run: |
          set -euo pipefail
          # The one package this job builds (`electron-builder --linux` on an x64 runner); afterPack already checked it before publishing
          node electron/hook/verify-forwarder.js dist/linux-unpacked --require-signed --arch x64

      - name: Make artifacts dir
        run: |
          mkdir -p artifacts

      - name: Generate Release Notes
        if: ${{ startsWith(matrix.os, 'ubuntu-') && startsWith(github.ref, 'refs/tags/') }}
        run: |
          bun run release:notes -- --to ${{ github.ref_name }} --output RELEASE_NOTES.md
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

      - name: Cleanup artifacts
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        run: |
          mv dist/*.{zip,dmg,deb,AppImage,exe,snap,rpm,tar.gz} artifacts || true

      - name: Cleanup artifacts Windows
        if: ${{ startsWith(matrix.os, 'windows-') }}
        run: |
          rm dist/anytypeHelper.exe
          rm dist/anytype-mcp.exe
          rm dist/nativeMessagingHost.exe
          mv dist/*.exe artifacts

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "artifacts/**"
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{secrets.TOKEN}}

      - name: debug
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        run: |
          echo "list dist/:"
          ls -alh dist/
          echo "list artifacts/:"
          ls -alh artifacts/

      - name: debug Windows
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: pwsh
        run: |
          Get-ChildItem -Path dist | Format-Table -Property Mode, LastWriteTime, Length, Name
          Get-ChildItem -Path artifacts | Format-Table -Property Mode, LastWriteTime, Length, Name

      - name: Upload artifacts to HTTP server
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        run: |
          RELEASE_VERSION=$( echo "$GITHUB_REF_NAME" | perl -pe 's/^[a-zA-Z]+//' )
          cd artifacts/
          for FILE in *; do
            UPLOAD_URL="https://publish-releases.anytype.io/desktop/upload/${RELEASE_VERSION}/${FILE}"
            echo "Uploading files to ${UPLOAD_URL}"
            curl \
              --header "Authorization: Bearer ${{ secrets.PUBLISH_RELEASES_TOKEN }}" \
              --upload-file ${FILE} \
              ${UPLOAD_URL}
          done
          cd ../dist/
          for FILE in *.yml; do
            UPLOAD_URL="https://publish-releases.anytype.io/desktop/upload/${RELEASE_VERSION}/${FILE}"
            echo "Uploading files to ${UPLOAD_URL}"
            curl \
              --header "Authorization: Bearer ${{ secrets.PUBLISH_RELEASES_TOKEN }}" \
              --upload-file ${FILE} \
              ${UPLOAD_URL}
          done

      - name: Upload artifacts to HTTP server Windows
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^[a-zA-Z]+', ''
          $files = Get-ChildItem -File artifacts
          foreach ($file in $files) {
            $encodedFileName = [System.Uri]::EscapeDataString($file.Name)
            $uploadUrl = "https://publish-releases.anytype.io/desktop/upload/$releaseVersion/$encodedFileName"
            echo "Uploading files to $uploadUrl"
            curl.exe -H "Authorization: Bearer ${{ secrets.PUBLISH_RELEASES_TOKEN }}" -T $file.FullName $uploadUrl
          }
          $yml_files = Get-ChildItem -File dist -Filter *.yml
          foreach ($file in $yml_files) {
            $encodedFileName = [System.Uri]::EscapeDataString($file.Name)
            $uploadUrl = "https://publish-releases.anytype.io/desktop/upload/$releaseVersion/$encodedFileName"
            echo "Uploading files to $uploadUrl"
            curl.exe -H "Authorization: Bearer ${{ secrets.PUBLISH_RELEASES_TOKEN }}" -T $file.FullName $uploadUrl
          }

      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tag_pattern: alpha
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
